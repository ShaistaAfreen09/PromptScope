name: PromptScope Continuous Integration

on:
  push:
    branches: [ main, staging ]
  pull_request:
    branches: [ main, staging ]

jobs:
  frontend-ci:
    runs-on: ubuntu-latest
    name: Frontend Quality Audits
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Package Dependencies
        run: npm ci

      - name: Run TypeScript Checks
        run: npm run lint

      - name: Execute Vitest Suites
        run: npx vitest run --coverage

  backend-ci:
    runs-on: ubuntu-latest
    name: Backend Python Quality Audits
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt pytest httpx pytest-cov

      - name: Run Python Linters (Flake8)
        run: |
          pip install flake8
          # stop the build if there are Python syntax errors or undefined names
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Run Pytest & Generate Coverage Reports
        run: |
          pytest --cov=backend --cov-report=xml

  security-scan:
    runs-on: ubuntu-latest
    name: DevSecOps Vulnerability Auditing
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Check for Exposed Secrets (TruffleHog)
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ""
          head: "HEAD"
          extra_args: --debug --only-verified

      - name: Run OWASP Dependency Checks
        uses: snyk/actions/node@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=high
