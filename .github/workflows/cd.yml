name: PromptScope Continuous Deployment

on:
  push:
    branches: [ main ]

jobs:
  docker-build-and-push:
    runs-on: ubuntu-latest
    name: Build & Publish Container Images
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Google Artifact Registry
        uses: docker/login-action@v3
        with:
          registry: us-central1-docker.pkg.dev
          username: _json_key
          password: ${{ secrets.GCP_SA_KEY }}

      - name: Build & Push Frontend Container
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.frontend
          push: true
          tags: us-central1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/promptscope/frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & Push Backend Container
        uses: docker/build-push-action@v5
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: us-central1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/promptscope/backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-to-staging:
    needs: docker-build-and-push
    runs-on: ubuntu-latest
    name: Zero-Downtime Rolling Deployment
    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Setup GCloud CLI
        uses: google-github-actions/setup-gcloud@v2

      - name: Deploy Backend to Google Cloud Run
        run: |
          gcloud run deploy promptscope-backend \
            --image us-central1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/promptscope/backend:latest \
            --region us-central1 \
            --platform managed \
            --allow-unauthenticated \
            --set-env-vars="ENV=production,DATABASE_URL=${{ secrets.PROD_DATABASE_URL }},FIREBASE_PROJECT_ID=${{ secrets.FIREBASE_PROJECT_ID }}"

      - name: Deploy Frontend to Google Cloud Run
        run: |
          gcloud run deploy promptscope-frontend \
            --image us-central1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/promptscope/frontend:latest \
            --region us-central1 \
            --platform managed \
            --allow-unauthenticated \
            --set-env-vars="NODE_ENV=production,GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }},APP_URL=https://promptscope.com"

  post-deploy-verification:
    needs: deploy-to-staging
    runs-on: ubuntu-latest
    name: Operational Gate Health Verification
    steps:
      - name: Ingress Health Verification
        run: |
          echo "Issuing dynamic operational query gate requests..."
          FOR_ATTEMPTS=0
          until [ $FOR_ATTEMPTS -ge 5 ]
          do
            STATUS_CODE=$(curl -s -o /dev/null -w "%{http_code}" https://promptscope.com/api/firebase-config || echo "failed")
            if [ "$STATUS_CODE" = "200" ]; then
              echo "Ingress connection validation succeeded!"
              exit 0
            else
              echo "Gate verification failed with status: $STATUS_CODE. Re-attempting in 10 seconds..."
              FOR_ATTEMPTS=$((FOR_ATTEMPTS+1))
              sleep 10
            fi
          done
          echo "Deployment Verification Failed. Initiating roll-back."
          exit 1
