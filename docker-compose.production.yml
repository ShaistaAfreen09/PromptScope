version: "3.8"

services:
  db:
    image: postgres:15-alpine
    container_name: promptscope-production-db
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 4G
        reservations:
          cpus: '0.5'
          memory: 1G
    environment:
      POSTGRES_USER: ${PROD_DB_USER:-postgres}
      POSTGRES_PASSWORD: ${PROD_DB_PASSWORD}
      POSTGRES_DB: promptscope_prod
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    networks:
      - database_network
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "5"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${PROD_DB_USER:-postgres} -d promptscope_prod"]
      interval: 10s
      timeout: 5s
      retries: 5

  chromadb:
    image: chromadb/chroma:0.4.24
    container_name: promptscope-production-chromadb
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 2G
    volumes:
      - chromadb_prod_data:/chroma/data
    networks:
      - ai_network
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/heartbeat"]
      interval: 15s
      timeout: 5s
      retries: 3

  backend:
    image: promptscope-backend:latest
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: promptscope-production-backend
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
    environment:
      - ENV=production
      - DEBUG=false
      - DATABASE_URL=postgresql+asyncpg://${PROD_DB_USER:-postgres}:${PROD_DB_PASSWORD}@db:5432/promptscope_prod
      - FIREBASE_PROJECT_ID=${FIREBASE_PROJECT_ID}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
    depends_on:
      db:
        condition: service_healthy
      chromadb:
        condition: service_healthy
    networks:
      - database_network
      - ai_network
      - ingress_network
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "10"

  frontend:
    image: promptscope-frontend:latest
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: promptscope-production-frontend
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
    environment:
      - NODE_ENV=production
      - PORT=3000
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - APP_URL=${APP_URL}
      - BACKEND_API_URL=http://backend:8000
    depends_on:
      - backend
    networks:
      - ingress_network
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

volumes:
  postgres_prod_data:
  chromadb_prod_data:

networks:
  ingress_network:
    driver: bridge
  database_network:
    driver: bridge
    internal: true
  ai_network:
    driver: bridge
    internal: true
